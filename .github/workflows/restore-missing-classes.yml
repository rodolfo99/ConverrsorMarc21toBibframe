name: Restaurar clases faltantes del ZIP original

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-missing-classes.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reconstruir clases desde el ZIP original
        shell: bash
        run: |
          set -euo pipefail
          REPAIR='src/main/java/mx/ucol/marc2bf/util/MarcRepairService.java'
          CONVERTER='src/main/java/mx/ucol/marc2bf/bibframe/MarcToBibframeConverter.java'
          mkdir -p "$(dirname "$REPAIR")" "$(dirname "$CONVERTER")"

          cat .restore/repair00 .restore/repair01 .restore/repair02 .restore/repair03 .restore/repair04 \
            | base64 -d > "$REPAIR"

          cat .restore/converter00 .restore/converter01 .restore/converter0203 \
              .restore/converter0405 .restore/converter0607 .restore/converter0809 \
              .restore/converter10 \
            | base64 -d > "$CONVERTER"

          test "$(wc -c < "$REPAIR")" -eq 21381
          test "$(wc -c < "$CONVERTER")" -eq 49161
          echo 'c73c1c7cf19293c3cd05844954f85de86662e483463a34ba03d2a67ae00dc447  src/main/java/mx/ucol/marc2bf/util/MarcRepairService.java' | sha256sum -c -
          echo '635aacbba70727dd1fac649b495b416e6ec2a63b38256b9d3b15efd51db6ae0b  src/main/java/mx/ucol/marc2bf/bibframe/MarcToBibframeConverter.java' | sha256sum -c -
          grep -q 'class MarcRepairService' "$REPAIR"
          grep -q 'class MarcToBibframeConverter' "$CONVERTER"

      - name: Compilar y ejecutar pruebas
        run: mvn -q test

      - name: Guardar restauración y limpiar temporales
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .restore
          rm -f .github/workflows/restore-missing-classes.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restaura clases Java faltantes desde el ZIP original'
          git push origin HEAD:main
