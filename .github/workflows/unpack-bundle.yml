name: Completar carga del proyecto

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Completar carga MARC21-BIBFRAME'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Descomprimir proyecto y documentación
        run: |
          unzip -o .upload/repo_bundle.zip -d .
          rm -rf .upload
          rm -f .github/workflows/unpack-bundle.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Guardar archivos descomprimidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes"
          else
            git commit -m "Descomprime proyecto MARC21-BIBFRAME y documentación"
            git push origin HEAD:main
          fi
